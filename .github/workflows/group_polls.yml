name: Post group polls

on:
  schedule:
    # roz 10 baar, subah 9:00 se raat 10:30 tak (IST)
    - cron: "30 3,6,9,12,15 * * *"
    - cron: "0 5,8,11,14,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run group poll poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHANNEL: "-1004402598845"
          POLL_STATE_FILE: poll_state_group.json
          POLL_ANONYMOUS: "false"
        run: node post_poll.js

      - name: Save poll state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add poll_state_group.json
          git diff --staged --quiet || (git commit -m "Update group poll state" && git pull --rebase && git push)
